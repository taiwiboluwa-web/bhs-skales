<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BHS Skales luxury imports and premium fashion sourced from Dubai, Milan, Istanbul, and Paris for Lagos."
    />
    <title>BHS Skales | Luxury Imports &amp; Premium Fashion</title>
    <style>
      :root {
        color: #f5f2eb;
        background: #0a0a08;
        font-family: Georgia, serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(180, 110, 25, 0.22), transparent 35%),
          radial-gradient(circle at 80% 70%, rgba(110, 45, 175, 0.16), transparent 35%),
          #0a0a08;
      }

      main {
        width: min(680px, calc(100% - 48px));
        text-align: center;
      }

      .eyebrow {
        color: #c9a84c;
        font: 0.72rem/1.4 monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0;
        font-size: clamp(2.8rem, 9vw, 6rem);
        font-weight: 400;
      }

      p {
        color: rgba(245, 242, 235, 0.7);
        font: 1rem/1.8 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Est. Lagos · Import Manifest Active</div>
      <h1>Sourced the world over.<br /><em>Cleared for Lagos.</em></h1>
      <p>
        BHS Skales is a curated luxury imports house sourcing exceptional fashion
        from Dubai, Milan, Istanbul, and Paris.
      </p>
    </main>
    <script src="/pet-widget.js"></script>
    <script>
      PetWidget.init({ color: "#d5a74a", scale: 1 });
    </script>
  </body>
</html>
